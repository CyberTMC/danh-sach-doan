<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo đóng nhận thông tin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border-top: 6px solid #e74c3c; /* Màu đỏ thông báo */
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #666;
            margin-bottom: 25px;
        }

        .status-badge {
            display: inline-block;
            background: #fdeaea;
            color: #e74c3c;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-home {
            display: inline-block;
            text-decoration: none;
            background: #3498db;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            transition: background 0.3s ease;
        }

        .btn-home:hover {
            background: #2980b9;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">📁</div>
        <div class="status-badge">Thông báo: Đã kết thúc</div>
        <h1>Ngừng nhận thông tin</h1>
        <p>
            Hiện tại hệ thống đã <strong>đóng cổng đăng ký</strong> thông tin. 
            Cảm ơn bạn đã quan tâm.
        </p>
        
        <a href="#" class="btn-home">Quay lại trang chủ</a>

        <div class="footer">
            &copy; 2026 Hệ thống quản lý thông tin 
        </div>
    </div>

</body>
</html>
