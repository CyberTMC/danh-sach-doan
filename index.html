<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Đoàn viên ưu tú | Hệ thống thu thập thông tin thế hệ mới</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 10% 30%, rgba(102, 126, 234, 0.35), rgba(118, 75, 162, 0.45)),
                        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MCIgaGVpZ2h0PSI4MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDQiIGQ9Ik0wIDBoNDB2NDBIMHoiLz48cGF0aCBkPSJNMjAgMTBhMTAgMTAgMCAwIDEgMCAyMCAxMCAxMCAwIDAgMSAwLTIweiIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjAuNSIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==');
            background-size: 80px 80px;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.8rem;
            position: relative;
            overflow-x: hidden;
        }

        /* animated gradient orbs */
        body::before {
            content: "";
            position: fixed;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,215,0,0.2), transparent);
            bottom: 10%;
            left: -80px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
            animation: floatGlow 12s infinite alternate;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(118,75,162,0.25), transparent);
            top: -120px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(70px);
            animation: floatGlow 15s infinite alternate-reverse;
            z-index: 0;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(25px, 35px) scale(1.2); opacity: 0.8; }
        }

        /* main glassmorphic card */
        .glass-card {
            position: relative;
            z-index: 10;
            max-width: 580px;
            width: 100%;
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            animation: cardRise 0.7s ease-out;
        }

        @keyframes cardRise {
            0% { opacity: 0; transform: translateY(35px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .glass-card:hover {
            box-shadow: 0 40px 65px rgba(0, 0, 0, 0.25);
            transform: translateY(-3px);
        }

        /* header with premium gradient and shine */
        .premium-header {
            background: linear-gradient(135deg, #1e1e2f, #2d2b4b);
            padding: 1.8rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .premium-header::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(25deg);
            pointer-events: none;
        }

        .icon-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem;
            border-radius: 3rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .icon-badge i {
            font-size: 2.5rem;
            background: linear-gradient(125deg, #f9f3a0, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .premium-header h2 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #FFFFFF, #E0D7FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .premium-header p {
            color: #cbc3ff;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* form styling */
        .form-container {
            padding: 2rem 2rem 2.2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #3a2c5a;
            margin-bottom: 0.5rem;
        }

        .input-group label i {
            font-size: 0.9rem;
            color: #6c5ce7;
        }

        .input-field {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            font-size: 0.95rem;
            background: #fefefe;
            border: 1.5px solid #e9e9f0;
            border-radius: 1.2rem;
            transition: all 0.25s ease;
            font-family: inherit;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .input-field:focus {
            border-color: #8c7ae6;
            outline: none;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.15), 0 0 0 3px rgba(108, 92, 231, 0.1);
            background: white;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            bottom: 0.85rem;
            font-size: 1.1rem;
            color: #a29bfe;
            transition: 0.2s;
            pointer-events: none;
        }

        /* readonly style elevated */
        .input-field[readonly] {
            background: #f1effa;
            border-style: dashed;
            border-color: #cbbfff;
            color: #3f3d56;
            font-weight: 500;
            cursor: default;
        }

        /* modern submit button */
        .btn-submit {
            background: linear-gradient(105deg, #6c5ce7 0%, #a463f5 100%);
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            margin-top: 0.8rem;
            box-shadow: 0 10px 20px -5px rgba(108, 92, 231, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 30px -8px rgba(108, 92, 231, 0.6);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            transform: scale(0.98);
            cursor: not-allowed;
            filter: grayscale(0.1);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        /* success message with micro-interaction */
        .toast-success {
            background: linear-gradient(115deg, #00b894, #00cec9);
            padding: 0.9rem;
            border-radius: 3rem;
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: scale(0.95);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 12px 20px rgba(0,184,148,0.3);
        }

        .toast-success.show {
            visibility: visible;
            opacity: 1;
            transform: scale(1);
        }

        /* floating shapes decoration */
        .floating-shape {
            position: fixed;
            z-index: 0;
            background: rgba(255,255,245,0.2);
            backdrop-filter: blur(5px);
            border-radius: 50%;
            width: 120px;
            height: 120px;
            pointer-events: none;
            animation: slowDrift 20s infinite alternate;
        }

        @keyframes slowDrift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(40px, 30px) rotate(10deg); }
        }

        /* responsive touch */
        @media (max-width: 550px) {
            .glass-card {
                border-radius: 1.8rem;
            }
            .form-container {
                padding: 1.5rem;
            }
            .premium-header h2 {
                font-size: 1.5rem;
            }
            .input-field {
                padding: 0.75rem 1rem 0.75rem 2.5rem;
            }
        }
    </style>
</head>
<body>

<!-- decorative floating elements (high end ambience) -->
<div class="floating-shape" style="top: 12%; left: -3%; width: 180px; height: 180px; background: radial-gradient(circle, #f5e5ff50, transparent);"></div>
<div class="floating-shape" style="bottom: 8%; right: -2%; width: 220px; height: 220px; background: radial-gradient(circle, #f0e6ff60, transparent); animation-duration: 25s;"></div>

<div class="glass-card">
    <div class="premium-header">
        <div class="icon-badge">
            <i class="fas fa-star-of-life"></i>
        </div>
        <h2>THÔNG TIN ĐOÀN VIÊN</h2>
        <p>Hệ thống cập nhật sinh hoạt & hồ sơ số</p>
        <div style="margin-top: 0.7rem; display: flex; justify-content: center; gap: 10px;">
            <i class="fas fa-id-card" style="color:#b8a9ff; font-size: 0.8rem;"></i>
            <i class="fas fa-shield-alt" style="color:#b8a9ff; font-size: 0.8rem;"></i>
            <i class="fas fa-database" style="color:#b8a9ff; font-size: 0.8rem;"></i>
        </div>
    </div>

    <div class="form-container">
        <form id="proForm">
            <!-- Họ tên -->
            <div class="input-group">
                <label><i class="fas fa-user-circle"></i> Họ và tên</label>
                <i class="fas fa-user input-icon"></i>
                <input type="text" class="input-field" name="hoTen" placeholder="Nguyễn Văn A" required autocomplete="off">
            </div>

            <!-- Ngày sinh -->
            <div class="input-group">
                <label><i class="fas fa-cake-candles"></i> Ngày tháng năm sinh</label>
                <i class="fas fa-calendar-alt input-icon"></i>
                <input type="text" class="input-field" name="ngaySinh" placeholder="VD: 15/10/2008" required>
            </div>

            <!-- Chi đoàn (readonly, giữ nguyên giá trị mặc định) -->
            <div class="input-group">
                <label><i class="fas fa-flag-checkered"></i> Chi đoàn (Mặc định)</label>
                <i class="fas fa-users input-icon"></i>
                <input type="text" class="input-field" name="chiDoan" value="12A2" readonly>
            </div>

            <!-- Khu / Thôn -->
            <div class="input-group">
                <label><i class="fas fa-tree"></i> Khu / Thôn</label>
                <i class="fas fa-map-marker-alt input-icon"></i>
                <input type="text" class="input-field" name="khuThon" placeholder="VD: Hòa Đình" required>
            </div>

            <!-- Xã / Phường -->
            <div class="input-group">
                <label><i class="fas fa-location-dot"></i> Xã / Phường</label>
                <i class="fas fa-map-signs input-icon"></i>
                <input type="text" class="input-field" name="xaPhuong" placeholder="VD: Võ Cường" required>
            </div>

            <!-- Huyện / Tỉnh -->
            <div class="input-group">
                <label><i class="fas fa-city"></i> Huyện / Tỉnh</label>
                <i class="fas fa-building input-icon"></i>
                <input type="text" class="input-field" name="huyenTinh" placeholder="VD: Bắc Ninh" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="fas fa-paper-plane"></i> XÁC NHẬN GỬI
            </button>
        </form>

        <div id="successMsg" class="toast-success">
            <i class="fas fa-check-circle fa-lg"></i> Gửi dữ liệu thành công! Cảm ơn đoàn viên.
        </div>
    </div>
</div>

<script>
    // ---------- GIỮ NGUYÊN LÕI HỆ THỐNG: URL FETCH & HANDLER CHUẨN ----------
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwMphFWGZavaqtzwiEYBQEB_Y6nnwyMiG2uGBGwA1Lsj-kfeW_MCvaEQQAXhFe-Qc16aQ/exec';
    const form = document.getElementById('proForm');
    const btn = document.getElementById('submitBtn');
    const msgDiv = document.getElementById('successMsg');

    // Hàm xử lý submit giữ nguyên logic gốc nhưng nâng tương tác (không ảnh hưởng chức năng)
    form.addEventListener('submit', e => {
        e.preventDefault();

        // Disable nút và hiệu ứng loading cao cấp
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> ĐANG XỬ LÝ...';

        // Tạo FormData từ form
        const formData = new FormData(form);

        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(response => {
            // Thành công: hiển thị thông báo đẹp
            msgDiv.classList.add('show');
            
            // Reset form nhưng giữ lại giá trị mặc định cho chi đoàn (vì reset làm mất)
            form.reset();
            // Quan trọng: đặt lại trường chi đoàn (readonly) về giá trị gốc
            const chiDoanField = form.querySelector('input[name="chiDoan"]');
            if (chiDoanField) chiDoanField.value = "12A2";
            
            // Tự động ẩn thông báo sau 5 giây
            setTimeout(() => {
                msgDiv.classList.remove('show');
            }, 5000);
        })
        .catch(error => {
            // Xử lý lỗi với thông báo thân thiện
            alert("⚠️ Lỗi kết nối máy chủ! Vui lòng kiểm tra mạng hoặc thử lại sau.");
            console.error('Fetch Error:', error.message);
        })
        .finally(() => {
            // Kích hoạt lại nút và khôi phục giao diện
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> XÁC NHẬN GỬI';
        });
    });

    // Thêm hiệu ứng focus nâng cao và micro validation gợi ý (giữ nguyên core)
    // Tùy chỉnh thêm hiệu ứng tương tác nhẹ cho nút nhưng không làm thay đổi luồng chính
    const allInputs = document.querySelectorAll('.input-field');
    allInputs.forEach(input => {
        input.addEventListener('focus', (e) => {
            e.target.parentElement.classList.add('focused');
        });
        input.addEventListener('blur', (e) => {
            e.target.parentElement.classList.remove('focused');
        });
    });
    
    // Xử lý edge: nếu getElementById mặc định, không thay đổi thuộc tính readonly ngoài giá trị.
    // Bảo đảm khi reset form, readonly field luôn là "12A2" cũng như xử lý nếu có script lạ.
    window.addEventListener('load', () => {
        // đảm bảo chi đoàn hiển thị đúng
        const chiDoanInput = document.querySelector('input[name="chiDoan"]');
        if (chiDoanInput && chiDoanInput.value !== "12A2") chiDoanInput.value = "12A2";
        
        // thêm animation tinh tế cho card
        const card = document.querySelector('.glass-card');
        if(card) card.style.animation = 'cardRise 0.6s ease-out';
    });
</script>
</body>
</html>
