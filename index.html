<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- ===== TWITTER CARD ===== -->

    <meta name="twitter:title" content="📝 ĐOÀN VIÊN 12A2 - Nhập thông tin tại đây">

    <!-- ===== THẺ BỔ SUNG GIÚP PREVIEW ĐẸP HƠN ===== -->
    <meta property="og:locale" content="vi_VN">
    <meta name="robots" content="index, follow">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #eef2f5;
            background-image: linear-gradient(145deg, #e9eef3 0%, #d9e0e8 100%);
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBmaWxsPSIjMjAyMTI4IiBmaWxsLW9wYWNpdHk9IjAuMDMiIGQ9Ik0wIDBoNDB2NDBIMHoiLz48cGF0aCBkPSJNMjAgMTBhMTAgMTAgMCAwIDEgMCAyMCAxMCAxMCAwIDAgMSAwLTIweiIgc3Ryb2tlPSIjMjAyMTI4IiBzdHJva2Utd2lkdGg9IjAuNCIgZmlsbD0ibm9uZSIvPjwvc3ZnPg==');
            background-repeat: repeat;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        .serious-card {
            position: relative;
            z-index: 10;
            max-width: 620px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2), 0 1px 2px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            animation: cardFadeIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        @keyframes cardFadeIn {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .serious-card:hover {
            box-shadow: 0 24px 42px -18px rgba(0, 0, 0, 0.28);
            transform: translateY(-2px);
        }

        .corporate-header {
            background: #1e2a3e;
            background: linear-gradient(115deg, #1a2a3f 0%, #0f1a27 100%);
            padding: 1.8rem 2rem;
            text-align: center;
            border-bottom: 3px solid #3b82f6;
            position: relative;
        }

        .badge-icon {
            background: rgba(59, 130, 246, 0.15);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6rem;
            border-radius: 60px;
            margin-bottom: 1rem;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-icon i {
            font-size: 2.2rem;
            color: #60a5fa;
            filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
        }

        .corporate-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #ffffff;
            margin-bottom: 0.35rem;
            word-break: keep-all;
        }

        .corporate-header p {
            color: #b9d0f0;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        .header-meta {
            margin-top: 0.75rem;
            display: flex;
            justify-content: center;
            gap: 1rem;
            font-size: 0.7rem;
            color: #8ba3c7;
        }

        .form-section {
            padding: 2rem 2rem 2.2rem;
            background: #ffffff;
        }

        .input-fieldset {
            margin-bottom: 1.4rem;
            position: relative;
        }

        .input-fieldset label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #2c3e50;
            margin-bottom: 0.55rem;
        }

        .input-fieldset label i {
            font-size: 0.85rem;
            color: #3b82f6;
            width: 18px;
        }

        .modern-input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.7rem;
            font-size: 0.95rem;
            background: #fcfcfd;
            border: 1.5px solid #e2e8f0;
            border-radius: 16px;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #1e293b;
            font-weight: 500;
        }

        .modern-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: #ffffff;
        }

        .modern-input[readonly] {
            background-color: #f1f5f9;
            border-style: solid;
            border-color: #cbd5e1;
            color: #334155;
            font-weight: 500;
            cursor: default;
        }

        .input-icon-line {
            position: absolute;
            left: 1rem;
            bottom: 0.85rem;
            font-size: 1rem;
            color: #94a3b8;
            transition: 0.2s;
            pointer-events: none;
        }

        .btn-submit-serious {
            background: #2c3e66;
            background: linear-gradient(95deg, #1f3a5f 0%, #2b4c7c 100%);
            border: none;
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .btn-submit-serious:hover {
            background: linear-gradient(95deg, #163250 0%, #1f3e60 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .btn-submit-serious:active {
            transform: translateY(1px);
        }

        .btn-submit-serious:disabled {
            opacity: 0.7;
            transform: scale(0.98);
            cursor: not-allowed;
            background: #59748f;
            box-shadow: none;
        }

        .status-notification {
            background: #e6f7ef;
            border-left: 5px solid #2e7d64;
            padding: 0.85rem;
            border-radius: 16px;
            margin-top: 1.5rem;
            text-align: center;
            font-weight: 600;
            color: #1e6f5c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transform: scale(0.96);
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            font-size: 0.9rem;
        }

        .status-notification.show {
            visibility: visible;
            opacity: 1;
            transform: scale(1);
        }

        .reminder-banner {
            background: #f0f4ff;
            border-radius: 14px;
            padding: 0.7rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #1e40af;
            border: 1px solid #c7d2fe;
        }
        .reminder-banner i {
            font-size: 1.2rem;
        }

        @media (max-width: 560px) {
            body {
                padding: 1rem;
            }
            .form-section {
                padding: 1.5rem;
            }
            .corporate-header h2 {
                font-size: 1.4rem;
            }
            .modern-input {
                padding: 0.7rem 1rem 0.7rem 2.4rem;
            }
            .btn-submit-serious {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="serious-card">
    <div class="corporate-header">
        <div class="badge-icon">
            <i class="fas fa-id-card"></i>
        </div>
        <h2>HỒ SƠ ĐOÀN VIÊN 12A2</h2>
        <p>Vui lòng nhập chính xác thông tin</p>
        <div class="header-meta">
            <span><i class="fas fa-check-circle"></i> Bảo mật thông tin</span>
            <span><i class="fas fa-database"></i> Đồng bộ trung tâm</span>
        </div>
    </div>

    <div class="form-section">
        <div class="reminder-banner">
            <i class="fas fa-info-circle"></i>
            <span><strong>📌 Hướng dẫn:</strong> Nhập thông tin vào form bên dưới ✅ Không cần gửi tin nhắn riêng.</span>
        </div>

        <form id="officialForm">
            <div class="input-fieldset">
                <label><i class="fas fa-user-pen"></i> Họ và tên</label>
                <i class="fas fa-user input-icon-line"></i>
                <input type="text" class="modern-input" name="hoTen" placeholder="Nguyễn Văn An" required autocomplete="off">
            </div>

            <div class="input-fieldset">
                <label><i class="fas fa-calendar-week"></i> Ngày tháng năm sinh</label>
                <i class="fas fa-cake-candles input-icon-line"></i>
                <input type="text" class="modern-input" name="ngaySinh" placeholder="VD: 15/10/2008" required>
            </div>

            <div class="input-fieldset">
                <label><i class="fas fa-flag"></i> Chi đoàn (Chính thức)</label>
                <i class="fas fa-layer-group input-icon-line"></i>
                <input type="text" class="modern-input" name="chiDoan" value="12A2" readonly>
            </div>

            <div class="input-fieldset">
                <label><i class="fas fa-leaf"></i> Khu / Thôn</label>
                <i class="fas fa-location-dot input-icon-line"></i>
                <input type="text" class="modern-input" name="khuThon" placeholder="VD: Hòa Đình, Khu 4" required>
            </div>

            <div class="input-fieldset">
                <label><i class="fas fa-map"></i> Xã / Phường</label>
                <i class="fas fa-map-pin input-icon-line"></i>
                <input type="text" class="modern-input" name="xaPhuong" placeholder="VD: Võ Cường" required>
            </div>

            <!-- ===== TRƯỜNG QUẬN/HUYỆN/TỈNH: KHÓA, MẶC ĐỊNH BẮC NINH ===== -->
            <div class="input-fieldset">
                <label><i class="fas fa-building"></i> Quận / Huyện / Tỉnh</label>
                <i class="fas fa-city input-icon-line"></i>
                <input type="text" class="modern-input" name="huyenTinh" value="Bắc Ninh" readonly>
            </div>

            <button type="submit" id="submitSeriousBtn" class="btn-submit-serious">
                <i class="fas fa-paper-plane"></i> XÁC NHẬN & GỬI DỮ LIỆU
            </button>
        </form>

        <div id="successToast" class="status-notification">
            <i class="fas fa-check-circle fa-lg"></i> Ghi nhận thành công! Dữ liệu đã được lưu.
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMphFWGZavaqtzwiEYBQEB_Y6nnwyMiG2uGBGwA1Lsj-kfeW_MCvaEQQAXhFe-Qc16aQ/exec';
    const formEl = document.getElementById('officialForm');
    const submitButton = document.getElementById('submitSeriousBtn');
    const successToast = document.getElementById('successToast');

    function resetFormKeepFixedValues() {
        formEl.reset();
        // Khôi phục các trường readonly sau reset
        const chiDoanField = formEl.querySelector('input[name="chiDoan"]');
        if (chiDoanField) chiDoanField.value = "12A2";
        
        const huyenTinhField = formEl.querySelector('input[name="huyenTinh"]');
        if (huyenTinhField) huyenTinhField.value = "Bắc Ninh";
    }

    // Kiểm tra validation trước khi submit
    function validateAndSubmit(e) {
        e.preventDefault();
        
        const requiredFields = ['hoTen', 'ngaySinh', 'khuThon', 'xaPhuong'];
        let isValid = true;
        
        for (let fieldName of requiredFields) {
            const field = formEl.querySelector(`[name="${fieldName}"]`);
            if (field && !field.value.trim()) {
                field.style.borderColor = "#dc2626";
                isValid = false;
                setTimeout(() => {
                    field.style.borderColor = "#e2e8f0";
                }, 1500);
            } else if (field) {
                field.style.borderColor = "#e2e8f0";
            }
        }
        
        if (!isValid) {
            alert("⚠️ Vui lòng điền đầy đủ thông tin bắt buộc trước khi gửi.");
            return;
        }

        // Submit thật sự
        submitButton.disabled = true;
        submitButton.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> ĐANG ĐỒNG BỘ...';

        const formData = new FormData(formEl);

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: formData,
            mode: 'no-cors',
        })
        .then(() => {
            successToast.classList.add('show');
            resetFormKeepFixedValues();
            setTimeout(() => {
                successToast.classList.remove('show');
            }, 5000);
        })
        .catch((error) => {
            console.error('Lỗi kết nối:', error);
            alert("⚠️ Lỗi kết nối mạng. Vui lòng kiểm tra lại và thử lại.");
        })
        .finally(() => {
            submitButton.disabled = false;
            submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> XÁC NHẬN & GỬI DỮ LIỆU';
        });
    }

    formEl.addEventListener('submit', validateAndSubmit);

    window.addEventListener('DOMContentLoaded', () => {
        // Đảm bảo các trường readonly có giá trị đúng
        const chiDoanField = formEl.querySelector('input[name="chiDoan"]');
        if (chiDoanField && chiDoanField.value !== "12A2") {
            chiDoanField.value = "12A2";
        }
        
        const huyenTinhField = formEl.querySelector('input[name="huyenTinh"]');
        if (huyenTinhField && huyenTinhField.value !== "Bắc Ninh") {
            huyenTinhField.value = "Bắc Ninh";
        }
        
        // Cập nhật URL động cho thẻ og:url
        const metaOgUrl = document.querySelector('meta[property="og:url"]');
        if (metaOgUrl && window.location.href) {
            metaOgUrl.setAttribute('content', window.location.href);
        }
    });
</script>
</body>
</html>
